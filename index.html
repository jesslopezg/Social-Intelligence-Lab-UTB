<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Intelligence Lab · UTB–ETD</title><style>
:root{font-family:system-ui,sans-serif;color:#eef7ff;background:#081528}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#184066,#081528 55%)}main{max-width:1180px;margin:auto;padding:20px}.hero{padding:30px;border-radius:22px;background:linear-gradient(110deg,#113350,#202244);border:1px solid #375677}.hero small{color:#6ce8f3;letter-spacing:2px;font-weight:bold}.hero h1{font-size:clamp(30px,6vw,48px);margin:12px 0}.hero em{font-style:normal;color:#53dcec}p{color:#afc8df;line-height:1.55}.badge{display:inline-block;border:1px solid #56718e;border-radius:20px;padding:7px 12px;color:#c7d9e7;font-size:12px;margin:3px}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.tabs button[aria-selected=true],.primary{background:#007e9e;border-color:#5cdbef}.panel{background:#10253d;border:1px solid #294962;border-radius:15px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:#17304b;border:1px solid #345471;border-radius:12px;padding:15px}.metric small{display:block;color:#95b7d4}.metric b{font-size:30px}button,select,textarea,input{font:inherit}button,select,input{background:#15314d;color:#eef8ff;border:1px solid #436584;border-radius:9px;padding:11px}button{cursor:pointer}textarea{background:#0b1c32;color:#fff;border:1px solid #436584;border-radius:9px;padding:12px;width:100%;min-height:130px}label{display:block;margin:12px 0 6px;color:#c4daea}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #69f0ff;outline-offset:2px}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:12px;background:#24425c;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#4dd4e4}.item{border-top:1px solid #294760;padding:10px 0}.item small{color:#91b6d5}.item p{margin:6px 0;color:#e6f3ff}.note{border-left:4px solid #52dfea;padding:14px;background:#193650;border-radius:7px;margin:12px 0;color:#e5f3fc}.comment{font-size:23px;padding:17px;background:#1a3853;border-left:4px solid #50dbe9}.controls{display:flex;gap:9px;flex-wrap:wrap}.scroll{max-height:400px;overflow:auto}h2{font-size:20px;margin:0 0 10px}li{margin-bottom:12px;line-height:1.5}footer{text-align:center;color:#94aec2;padding:28px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:12px}} </style></head><body><main><header class="hero"><small>UTB · ESCUELA DE TRANSFORMACIÓN DIGITAL</small><h1>SOCIAL <em>INTELLIGENCE</em> LAB</h1><p>Escucha social · NLP · Reputación de marca · Análisis de tendencias</p><span class="badge">LABORATORIO DOCENTE</span><span class="badge">DATOS SIMULADOS</span><span class="badge">SIN SERVIDOR NI API</span></header><nav class="tabs" id="tabs"></nav><section id="screen"></section><footer>UTB–ETD · Herramienta de simulación educativa · Sin conexión a redes sociales en tiempo real</footer></main><script>
(()=>{'use strict';const samples=[['Instagram','Producto','Me encantó el latte de vainilla, está delicioso','2026-10-01'],['TikTok','Servicio','Esperé 35 minutos, pésimo servicio','2026-10-02'],['X','Precio','Los precios son demasiado caros','2026-10-03'],['Google Reviews','Experiencia','Ambiente cómodo para trabajar','2026-10-04'],['Instagram','Sostenibilidad','¿Los vasos son reciclables?','2026-10-05'],['TikTok','Producto','Me encantó el nuevo cold brew','2026-10-06'],['Google Reviews','Servicio','Personal grosero y pedido tarde','2026-10-07'],['X','Sostenibilidad','Demasiado plástico para una marca ecológica','2026-10-08'],['Instagram','Experiencia','Me encanta la música y decoración','2026-10-09'],['TikTok','Precio','¿Cuánto cuesta el desayuno?','2026-10-10'],['Google Reviews','Producto','Café frío y sabor horrible','2026-10-11'],['X','Servicio','Me atendieron rápido, gran servicio','2026-10-12'],['Instagram','Precio','Muy buenas promociones','2026-10-13'],['TikTok','Sostenibilidad','Me gustan los vasos reutilizables','2026-10-14'],['Google Reviews','Experiencia','Mesas sucias y mucho ruido','2026-10-15'],['X','Producto','¿Cuándo sale la nueva bebida?','2026-10-16']];const lex={positivo:['delicioso','encanta','encantó','excelente','increíble','rápido','buenas','perfecto','amable'],negativo:['pésimo','tarde','grosero','horrible','frío','caros','sucias','ruido','incompleto','lento','terrible']},themes={Producto:['café','latte','bebida','sabor','cold brew'],Servicio:['servicio','pedido','atend','personal','esper'],Precio:['precio','caro','cuesta','promocion'],Experiencia:['ambiente','música','decoración','mesas','ruido'],Sostenibilidad:['recicl','plástico','ecológ','reutilizable']};const tabs=['Radar','NLP Lab','Tendencias','Práctica guiada','Evaluación','Evidencias'];let rows=[],tab='Radar',channel='Todos',topic='Todos',step=0,score=0,answered=false,choice='';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function classify(content){let s=norm(content),p=lex.positivo.filter(w=>s.includes(norm(w))),n=lex.negativo.filter(w=>s.includes(norm(w))),rank=Object.entries(themes).map(([k,words])=>[k,words.filter(w=>s.includes(norm(w))).length]).sort((a,b)=>b[1]-a[1]);return{sentiment:p.length>n.length?'positivo':n.length>p.length?'negativo':'neutral',topic:rank[0][1]?rank[0][0]:'Sin clasificar',p,n,mixed:!!(p.length&&n.length),negation:/\b(no|nunca|sin)\b/.test(s)}}function record(a){let r=classify(a[2]);return{channel:a[0],topic:a[1]||r.topic,content:a[2],date:a[3]||'',sentiment:r.sentiment}}rows=samples.map(record);function file(name,data,mime){let u=URL.createObjectURL(new Blob([data],{type:mime||'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportCsv(data){let keys=['date','channel','topic','sentiment','content'];file('social-intelligence-lab.csv','\ufeff'+[keys,...data.map(r=>keys.map(k=>r[k]))].map(line=>line.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function select(id,values,current){return '<select id="'+id+'">'+values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>'}function metric(label,value){return '<div class="metric"><small>'+label+'</small><b>'+value+'</b></div>'}function bar(name,count,total,color){return '<p class="flex"><span>'+esc(name)+'</span><b>'+count+'</b></p><div class="bar"><span style="width:'+(total?count/total*100:0)+'%;background:'+(color||'#4dd4e4')+'"></span></div>'}function render(){ $('tabs').innerHTML=tabs.map(t=>'<button data-tab="'+t+'" aria-selected="'+(tab===t)+'">'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==='Radar')radar();if(tab==='NLP Lab')nlp();if(tab==='Tendencias')trends();if(tab==='Práctica guiada')practice();if(tab==='Evaluación')quiz();if(tab==='Evidencias')evidence()}
function radar(){let data=rows.filter(r=>(channel==='Todos'||r.channel===channel)&&(topic==='Todos'||r.topic===topic)),total=data.length,n=s=>data.filter(r=>r.sentiment===s).length;$('screen').innerHTML='<div class="panel flex"><div><h2>Radar de reputación</h2><p>Filtra menciones por canal y tema</p></div><div class="controls">'+select('channel',['Todos',...new Set(rows.map(r=>r.channel))],channel)+select('topic',['Todos',...new Set(rows.map(r=>r.topic))],topic)+'</div></div><div class="metrics">'+metric('MENCIONES',total)+metric('POSITIVAS',total?Math.round(n('positivo')/total*100)+'%':'0%')+metric('NEGATIVAS',total?Math.round(n('negativo')/total*100)+'%':'0%')+metric('BALANCE',total?Math.round((n('positivo')-n('negativo'))/total*100):0)+'</div><div class="grid" style="margin-top:14px"><div class="panel"><h2>Distribución de sentimientos</h2>'+bar('Positivo',n('positivo'),total,'#52deb1')+bar('Neutral',n('neutral'),total,'#b7c6d8')+bar('Negativo',n('negativo'),total,'#fa83a3')+'</div><div class="panel"><h2>Temas de conversación</h2>'+[...new Set(rows.map(r=>r.topic))].map(t=>bar(t,data.filter(r=>r.topic===t).length,total)).join('')+'</div></div><div class="panel"><div class="flex"><h2>Voz del consumidor</h2><button id="csv">Descargar CSV</button></div><div class="scroll">'+(data.map(r=>'<div class="item"><small>'+esc(r.date)+' · '+esc(r.channel)+' · '+esc(r.topic)+' · '+esc(r.sentiment)+'</small><p>'+esc(r.content)+'</p></div>').join('')||'<p>No hay registros para estos filtros.</p>')+'</div></div>';$('channel').onchange=e=>{channel=e.target.value;render()};$('topic').onchange=e=>{topic=e.target.value;render()};$('csv').onclick=()=>exportCsv(data)}
function nlp(){$('screen').innerHTML='<div class="grid"><div class="panel"><h2>Clasificador NLP educativo</h2><p>Ingresa un comentario. Método de palabras clave, no IA entrenada.</p><label for="comment">Comentario</label><textarea id="comment" maxlength="3000" placeholder="El café está delicioso pero el servicio fue lento"></textarea><label for="source">Canal</label>'+select('source',['Instagram','TikTok','X','Google Reviews','Otro'],'Instagram')+'<div class="controls" style="margin-top:12px"><button id="analyse" class="primary">Analizar</button><button id="try">Usar ejemplo</button></div><div id="result" aria-live="polite"></div></div><div class="panel"><h2>Interpretación crítica</h2><p>La ironía, las negaciones, los modismos y las opiniones mixtas pueden cambiar el significado real.</p><div class="note">Un análisis léxico no ofrece probabilidades calibradas. Contrasta la salida automática con una clasificación humana y explica los desacuerdos.</div><h3>Reto</h3><p>¿Qué pasa con «No fue un mal servicio»? ¿Y con «Excelente producto, pésima atención»?</p></div></div>';$('try').onclick=()=>$('comment').value='El café está delicioso, pero el servicio fue lento';$('analyse').onclick=()=>{let s=$('comment').value.trim();if(!s){$('result').textContent='Escribe un comentario.';return}let r=classify(s);$('result').innerHTML='<div class="note"><b>Sentimiento: '+esc(r.sentiment)+'</b><p>Tema: '+esc(r.topic)+'</p><p>Positivas: '+esc(r.p.join(', ')||'ninguna')+' · Negativas: '+esc(r.n.join(', ')||'ninguna')+'</p>'+((r.mixed||r.negation)?'<p>⚠ Requiere revisión por opinión mixta o negación.</p>':'')+'<button id="add">Añadir al radar</button></div>';$('add').onclick=()=>{rows.unshift(record([$('source').value,r.topic,s,new Date().toISOString().slice(0,10)]));tab='Radar';channel='Todos';topic='Todos';render()}}}
function trends(){let valid=rows.filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date)),dates=[...new Set(valid.map(r=>r.date))].sort(),cut=Math.floor(dates.length/2),a=dates.slice(0,cut),b=dates.slice(cut),topics=[...new Set(valid.map(r=>r.topic))];$('screen').innerHTML='<div class="panel"><h2>Tendencias exploratorias por periodo</h2><p>Compara los registros de la primera y segunda mitad de las fechas observadas. Los periodos no necesariamente son equivalentes.</p><div class="grid">'+topics.map(t=>{let x=valid.filter(r=>r.topic===t&&a.includes(r.date)).length,y=valid.filter(r=>r.topic===t&&b.includes(r.date)).length;return'<div class="panel"><h3>'+esc(t)+'</h3><p>Periodo 1: '+x+' · Periodo 2: '+y+'</p>'+bar('Periodo 2',y,Math.max(x,y,1))+'</div>'}).join('')+'</div><div class="note">El volumen de menciones por sí solo no demuestra una tendencia general ni una crisis. Considera tamaño de muestra, intervalo temporal y método de recopilación.</div></div>'}
function practice(){$('screen').innerHTML='<div class="panel"><h2>Práctica guiada · Diagnóstico reputacional</h2><p><b>Caso ficticio:</b> Nébula Coffee recibe opiniones sobre producto, servicio, precio y sostenibilidad.</p><ol><li>En Radar, filtra Servicio y registra cantidad, porcentaje negativo y dos citas breves.</li><li>Compara Servicio y Producto. ¿En qué tema hay más preocupación?</li><li>En NLP Lab, clasifica «Excelente café, pero esperé demasiado». Contrasta el resultado automático con tu interpretación.</li><li>Prueba «No fue un mal servicio». Explica el efecto de la negación.</li><li>En Tendencias, compara periodos y explica por qué el aumento de menciones no demuestra una crisis.</li><li>Propón una mejora operativa y una acción de comunicación, justificadas con datos.</li><li>En Evidencias, redacta hallazgos, limitaciones y recomendaciones. Descarga el reporte y el CSV para entregarlos en Savio.</li></ol><div class="note">No uses datos sensibles. Distingue siempre datos simulados, datos recopilados y resultados inferidos.</div></div>'}
const questions=[['El nuevo latte es espectacular, me encantó.','positivo','Es un elogio explícito.'],['El pedido llegó incompleto y el personal fue grosero.','negativo','Se describen problemas de servicio.'],['¿A qué hora abren mañana?','neutral','Es una consulta informativa.'],['Excelente café, pero el servicio fue pésimo.','mixto','Combina evaluaciones de signo opuesto.'],['Qué maravilla, otra vez 40 minutos esperando 🙄','negativo','El contexto y el emoji indican sarcasmo.']];function quiz(){if(step>=questions.length){$('screen').innerHTML='<div class="panel"><h2>Evaluación completada</h2>'+metric('Puntuación orientativa',score+'/100')+'<p>La calificación no se registra automáticamente en Savio.</p><button id="again" class="primary">Reiniciar</button></div>';$('again').onclick=()=>{step=0;score=0;answered=false;render()};return}let q=questions[step];$('screen').innerHTML='<div class="panel"><div class="flex"><h2>Reto de clasificación humana</h2><b>'+(step+1)+'/5 · '+score+' puntos</b></div><div class="comment">'+esc(q[0])+'</div><p>Selecciona el sentimiento más apropiado:</p><div class="controls">'+['positivo','neutral','negativo','mixto'].map(t=>'<button data-answer="'+t+'" '+(answered?'disabled':'')+'>'+t+'</button>').join('')+'</div>'+(answered?'<div class="note"><b>'+(choice===q[1]?'Correcto':'Respuesta de referencia: '+q[1])+'</b><p>'+q[2]+'</p><button id="next" class="primary">Continuar</button></div>':'')+'</div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;choice=b.dataset.answer;if(choice===q[1])score+=20;answered=true;render()});if($('next'))$('next').onclick=()=>{step++;answered=false;render()}}
function parseCSV(text){let out=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))out.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('Comillas sin cerrar');row.push(field);if(row.some(x=>x.trim()))out.push(row);return out}function evidence(){$('screen').innerHTML='<div class="grid"><div class="panel"><h2>Cargar datos CSV</h2><p>Formato: <code>content,channel,date</code>. El campo <code>content</code> es obligatorio. Análisis local en el navegador.</p><input type="file" id="upload" accept=".csv,text/csv" style="max-width:100%"><p>Hasta 1 MB y 1.000 registros; usar datos anonimizados.</p><div id="status" class="note" role="status">No se ha seleccionado un archivo.</div><div class="controls"><button id="reset">Restaurar simulación</button><button id="export">Exportar CSV</button></div></div><div class="panel"><h2>Reporte para Savio</h2><label for="team">Código de equipo</label><input id="team" maxlength="80" placeholder="Equipo 1"><label for="findings">Hallazgos y datos que los respaldan</label><textarea id="findings"></textarea><label for="limits">Limitaciones</label><textarea id="limits"></textarea><label for="actions">Recomendaciones justificadas</label><textarea id="actions"></textarea><button id="report" class="primary">Descargar reporte TXT</button><p>Adjunta CSV y reporte en Savio; no se envían automáticamente.</p></div></div>';$('reset').onclick=()=>{rows=samples.map(record);$('status').textContent='Simulación restaurada.'};$('export').onclick=()=>exportCsv(rows);$('upload').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>1048576)throw Error('Máximo 1 MB.');let lines=parseCSV((await f.text()).replace(/^\ufeff/,'')),heads=lines.shift().map(x=>norm(x.trim())),ci=heads.indexOf('content'),ch=heads.indexOf('channel'),di=heads.indexOf('date');if(ci<0)throw Error('Falta la columna content.');let data=lines.slice(0,1000).map(r=>record([ch<0?'Otro':r[ch]||'Otro','',r[ci]||'',di<0?'':r[di]||''])).filter(r=>r.content.trim());if(!data.length)throw Error('Archivo sin comentarios.');rows=data;topic='Todos';channel='Todos';$('status').textContent='Importados '+data.length+' comentarios. Revisa el Radar.'}catch(err){$('status').textContent='Error: '+err.message}};$('report').onclick=()=>{let x=['findings','limits','actions'].map(id=>$(id).value.trim());if(x.some(v=>!v)){alert('Completa los tres campos del reporte.');return}let out='SOCIAL INTELLIGENCE LAB · UTB–ETD\nEquipo: '+$('team').value+'\nRegistros analizados: '+rows.length+'\nMétodo: clasificación léxica exploratoria, sin modelo entrenado.\n\nHALLAZGOS\n'+x[0]+'\n\nLIMITACIONES\n'+x[1]+'\n\nRECOMENDACIONES\n'+x[2]+'\n';file('reporte-social-intelligence-lab.txt',out)}}render()})();
</script></body></html>
