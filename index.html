<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Intelligence Lab · UTB</title><style>
:root{font-family:system-ui,-apple-system,Arial;background:#071223;color:#eaf5ff}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:16px}header{background:linear-gradient(115deg,#102744,#242052);padding:30px;border:1px solid #315477;border-radius:20px}header small{color:#66e1f2;letter-spacing:2px;font-weight:700}h1{font-size:clamp(27px,5vw,49px);margin:12px 0}h1 em{color:#5be5f2;font-style:normal}p{color:#b9cbe0;line-height:1.55}.badge{display:inline-block;padding:7px 12px;border-radius:30px;background:#ffffff17;margin:5px 5px 0 0;font-size:11px}nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.btn,button,select,textarea{font:inherit}button,select{border:1px solid #375372;border-radius:9px;background:#142b48;color:#eaf5ff;padding:11px;cursor:pointer}button.active,.primary{background:#007d9f;border-color:#33c9df}.panel{background:#0f2037;border:1px solid #284260;border-radius:15px;padding:20px;margin-bottom:15px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metrics .panel{display:flex;flex-direction:column;gap:8px}.metrics strong{font-size:32px}.metrics small{color:#94b4cf}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 0 10px}article{border-top:1px solid #2a4260;padding:12px 0}article small{color:#8eb4d1;margin-right:10px}article p{margin:6px 0}textarea{background:#0a1a30;border:1px solid #42627e;color:white;width:100%;padding:15px;border-radius:10px;min-height:125px}.bars{display:grid;gap:14px;margin-top:24px}.bar{height:13px;background:#1b3654;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#56d7ef;border-radius:10px}.result{padding:16px;background:#182f4d;border-radius:10px;margin-top:16px}.pill{padding:5px 9px;border-radius:10px;background:#1b3654;margin-right:7px;font-size:12px}.chart{display:flex;gap:9px;align-items:end;height:190px;padding-top:15px}.chart>div{flex:1;text-align:center;font-size:11px;color:#9db8cf}.chart b{display:block;background:#36b8df;border-radius:6px 6px 0 0;min-height:3px}.chart label{display:block;margin-top:9px}blockquote{background:#192f4e;padding:24px;border-left:4px solid #50d5f0;font-size:21px;margin:18px 0}footer{color:#7895b5;text-align:center;padding:30px;font-size:12px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}header{padding:22px}}
</style></head><body><main><header><small>UTB · ESCUELA DE TRANSFORMACIÓN DIGITAL</small><h1>SOCIAL <em>INTELLIGENCE</em> LAB</h1><p>Escucha social · Reputación de marca · Procesamiento de lenguaje natural</p><span class="badge">● LABORATORIO OPERATIVO</span><span class="badge">NÉBULA COFFEE</span><span class="badge">DATOS SIMULADOS</span></header><nav id="nav"></nav><div id="content"></div><footer>UTB · Social Intelligence Lab · Simulación educativa, sin conexión en tiempo real a redes sociales</footer></main><script>
(function(){
const seed=[['Instagram','Producto','positivo','El latte de vainilla es delicioso'],['TikTok','Servicio','negativo','Esperé 35 minutos, pésimo servicio'],['X','Precio','negativo','Los precios son demasiado caros'],['Google Reviews','Experiencia','positivo','Ambiente cómodo para trabajar'],['Instagram','Sostenibilidad','neutral','¿Los vasos son reciclables?'],['TikTok','Producto','positivo','Me encantó el nuevo cold brew'],['Google Reviews','Servicio','negativo','Personal grosero y pedido tarde'],['X','Sostenibilidad','negativo','Demasiado plástico para una marca ecológica'],['Instagram','Experiencia','positivo','Me encanta la música y decoración'],['TikTok','Precio','neutral','¿Cuánto cuesta el desayuno?'],['Google Reviews','Producto','negativo','Café frío y sabor horrible'],['X','Servicio','positivo','Me atendieron rápido, gran servicio'],['Instagram','Precio','positivo','Muy buenas promociones'],['TikTok','Sostenibilidad','positivo','Me gustan los vasos reutilizables'],['Google Reviews','Experiencia','negativo','Mesas sucias y mucho ruido'],['X','Producto','neutral','¿Cuándo sale la nueva bebida?']].map((r,i)=>({id:i,...Object.fromEntries(['channel','topic','sentiment','content'].map((k,j)=>[k,r[j]]))}));
let rows=seed,tab='Radar',channel='Todos',topic='Todos',score=0,q=0,answered=false;
const $=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=['Producto','Servicio','Precio','Experiencia','Sostenibilidad'],channels=['Instagram','TikTok','X','Google Reviews'],sentiments=['positivo','neutral','negativo'];
const words={positivo:['delicioso','encanta','encantó','excelente','increíble','rápido','buenas','perfecto'],negativo:['pésimo','tarde','grosero','horrible','frío','caro','sucias','ruido','incompleto','lento']};
const topics={Producto:['café','latte','bebida','sabor'],Servicio:['servicio','pedido','atend','personal','esper'],Precio:['precio','caro','cuesta','cobran','promocion'],Experiencia:['ambiente','música','decoración','mesas','ruido'],Sostenibilidad:['recicl','plástico','ecológ','ambiental','reutilizable']};
function classify(s){let t=s.toLowerCase(),p=words.positivo.filter(w=>t.includes(w)).length,n=words.negativo.filter(w=>t.includes(w)).length;let topic=Object.entries(topics).map(([k,v])=>[k,v.filter(w=>t.includes(w)).length]).sort((a,b)=>b[1]-a[1])[0];return{sentiment:p>n?'positivo':n>p?'negativo':'neutral',topic:topic[1]?topic[0]:'Sin clasificar',mixed:p>0&&n>0}}
function select(name,items,value){return '<select id="'+name+'">'+items.map(x=>'<option '+(x===value?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function render(){ $('nav').innerHTML=['Radar','NLP Lab','Tendencias','Simulador'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='Radar'){let data=rows.filter(r=>(channel==='Todos'||r.channel===channel)&&(topic==='Todos'||r.topic===topic)),counts=sentiments.map(s=>data.filter(r=>r.sentiment===s).length),total=data.length;
$('content').innerHTML='<section class="panel flex"><div><h2>Radar de reputación</h2><p>Filtra las menciones por canal y tema</p></div><div>'+select('channel',['Todos',...channels],channel)+' '+select('topic',['Todos',...categories],topic)+'</div></section><div class="metrics">'+[['MENCIONES',total],['POSITIVAS',total?Math.round(counts[0]/total*100)+'%':'0%'],['NEGATIVAS',total?Math.round(counts[2]/total*100)+'%':'0%'],['BALANCE',total?Math.round((counts[0]-counts[2])/total*100):0]].map(([k,v])=>'<div class="panel"><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div><div class="columns"><section class="panel"><h2>Distribución de sentimientos</h2><div class="bars">'+sentiments.map((s,i)=>'<div><div class="flex"><span>'+s+'</span><b>'+counts[i]+'</b></div><div class="bar"><i style="width:'+(total?counts[i]/total*100:0)+'%;background:'+['#24d9a2','#9bacc6','#ff6b91'][i]+'"></i></div></div>').join('')+'</div></section><section class="panel"><h2>Temas de conversación</h2><div class="bars">'+categories.map(s=>{let n=data.filter(r=>r.topic===s).length;return '<div><div class="flex"><span>'+s+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+(total?n/total*100:0)+'%"></i></div></div>'}).join('')+'</div></section></div><section class="panel"><div class="flex"><h2>Voz del consumidor</h2><button id="csv">↓ Exportar CSV</button></div>'+data.map(r=>'<article><small>'+escape(r.channel)+'</small><small>'+escape(r.topic)+'</small><small>'+escape(r.sentiment)+'</small><p>'+escape(r.content)+'</p></article>').join('')+'</section>';
$('channel').onchange=e=>{channel=e.target.value;render()};$('topic').onchange=e=>{topic=e.target.value;render()};$('csv').onclick=()=>{let fields=['channel','topic','sentiment','content'];let csv='\ufeff'+[fields,...data.map(r=>fields.map(k=>r[k]))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='social-intelligence-lab.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
if(tab==='NLP Lab'){$('content').innerHTML='<div class="columns"><section class="panel"><h2>Clasificador NLP</h2><p>Introduce un comentario y evalúa su polaridad y tema. Clasificador léxico educativo, no IA entrenada.</p><textarea id="comment" placeholder="Ej.: El café está delicioso, pero el servicio fue lento"></textarea><button id="analyze" class="primary">Analizar comentario ↗</button><div id="analysis"></div></section><section class="panel"><h2>Interpretación crítica</h2><p>La ironía, el sarcasmo, las negaciones y las opiniones mixtas pueden alterar el resultado de los métodos basados en palabras clave.</p><div class="result">Actividad: compara el resultado automático con tu evaluación humana y justifica cualquier diferencia.</div></section></div>';$('analyze').onclick=()=>{let s=$('comment').value.trim();if(!s)return;let r=classify(s);$('analysis').innerHTML='<div class="result"><h2>Resultado preliminar</h2><p>Sentimiento: <b>'+r.sentiment+'</b></p><p>Tema: <b>'+r.topic+'</b></p>'+(r.mixed?'<p>⚠ Opinión mixta: requiere revisión humana.</p>':'')+'<button id="add" class="primary">Añadir al radar</button></div>';$('add').onclick=()=>{rows.unshift({id:Date.now(),channel:'Instagram',topic:r.topic,sentiment:r.sentiment,content:s});tab='Radar';render()}}}
if(tab==='Tendencias'){$('content').innerHTML='<section class="panel"><h2>Explorador de tendencias</h2><p>Comparación ficticia de menciones entre dos periodos. No representa datos reales de redes sociales.</p><div class="chart">'+categories.map((s,i)=>'<div><b style="height:'+([8,17,12,13,14][i]*8)+'px"></b><label>'+s+'</label></div>').join('')+'</div><div class="result"><b>Discusión</b><p>¿Qué tema amerita investigación? ¿Cómo distinguirías una tendencia de una crisis de reputación?</p></div></section>'}
if(tab==='Simulador'){let questions=[['El nuevo latte es espectacular, me encantó.','positivo'],['El pedido llegó incompleto y el personal fue grosero.','negativo'],['¿A qué hora abren mañana?','neutral'],['Excelente café, pero el servicio fue pésimo.','neutral'],['Qué maravilla, otra vez 40 minutos esperando 🙄','negativo']];$('content').innerHTML='<section class="panel"><div class="flex"><h2>Misión: analista de reputación</h2><b>'+score+'/100</b></div>'+(q<questions.length?'<p>Comentario '+(q+1)+' de '+questions.length+'</p><blockquote>'+escape(questions[q][0])+'</blockquote><div id="choices">'+sentiments.map(s=>'<button data-answer="'+s+'" '+(answered?'disabled':'')+'>'+s+'</button> ').join('')+'</div>'+(answered?'<div class="result"><p>Respuesta de referencia: <b>'+questions[q][1]+'</b></p><button id="next" class="primary">Continuar →</button></div>':''):'<div class="result"><h2>Reto completado</h2><p>Calificación: '+score+'/100</p><button id="reset" class="primary">Reiniciar</button></div>')+'</section>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.dataset.answer===questions[q][1])score+=20;answered=true;render()});if($('next'))$('next').onclick=()=>{q++;answered=false;render()};if($('reset'))$('reset').onclick=()=>{q=0;score=0;answered=false;render()}}
}render();
})();
</script></body></html>
